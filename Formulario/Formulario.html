<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario GYM</title>
    <link rel="stylesheet" href="EstiloFormulario.css">
</head>

<body>

    <header>
        <h1>Formulario Valhalla GYM</h1>
    </header>
    <h2>Inscripcion</h2>
    <form name="Datos del cliente" id="Formulario">
        <div class="Registro">
            <label for="Nombre">Nombre Completo</label>
            <input type="text" class="label" placeholder="Ingrese tu Nombre Completo"><br>
            <label for="Edad">Edad</label>
            <input type="number" class="label" placeholder="Ingresa tu edad"><br>
            <label for="Dias">Dias de entreno a la semana</label>
            <input type="number" class="label" placeholder="Ingrese dias de entreno a la semana"><br>
            <label>Que grupo de musculos quiere entrenar</label><br>
            <label for="Pecho">Pecho</label>
            <input type="checkbox" name="Pecho" value="Pecho">Pecho<br>
            <label for="Espalda">Espalda</label>
            <input type="checkbox" name="Espalda" value="Espalda">Espalda<br>
            <label for="Piernas">Piernas</label>
            <input type="checkbox" name="Piernas" value="Piernas">Piernas<br>
            <label for="Brazos">Brazos</label>
            <input type="checkbox" name="Brazos" value="Brazos">Brazos<br>
            <label for="Abdomen">Abdomen</label>
            <input type="checkbox" name="Abdomen" value="Abdomen">Abdomen<br>
            <label for="Hombros">Hombros</label>
            <input type="checkbox" name="Hombros" value="Hombros">Hombros<br>
            <label for="Entrenador">Entrenadores</label>
            <select name="Entrenador" id="Entrenador">
                <option value="0">Seleccione un entrenador</option>
                <option value="1">Juljhancer Cañarte</option>
                <option value="2">Neicer Loor</option>
                <option value="3">Erick Arguello</option>
                <option value="4">Juleidy Briones</option>
                <option value="5">Cristina Bermúdez</option>
                <option value="6">Valeria Zambrano</option>
            </select>
            <div class="Boton_registro">
                <input type="submit" value="Registrarse">
                <input type="reset" value="Borrar registro">
            </div>
        </div>
    </form>
    <footer>
        <p>Derechos reservados Valhalla GYM</p>
    </footer>
    <script src="Validacion.js"></script>
</body>

</html>
